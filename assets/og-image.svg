<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- OG image — Sanak social share card -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF7F0"/>
      <stop offset="1" stop-color="#F5EDDF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative subtle dots -->
  <circle cx="100" cy="100" r="2" fill="#1F1A14" opacity="0.08"/>
  <circle cx="1100" cy="500" r="2" fill="#1F1A14" opacity="0.08"/>
  <circle cx="1100" cy="100" r="2" fill="#B8421A" opacity="0.15"/>

  <!-- Logo -->
  <g transform="translate(90, 90)">
    <circle cx="50" cy="50" r="32" stroke="#B8421A" stroke-width="6" fill="none"/>
    <circle cx="78" cy="50" r="32" stroke="#1F1A14" stroke-width="6" fill="none"/>
    <circle cx="64" cy="50" r="5" fill="#B8421A"/>
  </g>
  <text x="200" y="148" font-family="Inter, sans-serif" font-size="34" font-weight="700" fill="#1F1A14">Sanak</text>

  <!-- Title -->
  <text x="90" y="290" font-family="Fraunces, serif" font-size="76" font-weight="500" fill="#1F1A14" font-style="italic">An AI family assistant</text>
  <text x="90" y="370" font-family="Fraunces, serif" font-size="56" font-weight="400" fill="#1F1A14">for 60 million Indonesian MSMEs</text>

  <!-- Subline -->
  <text x="90" y="440" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#4A3F30">Voice-first · accessibility-first · bilingual</text>

  <!-- Pilot tag -->
  <rect x="90" y="490" width="320" height="46" rx="23" fill="#B8421A" opacity="0.12"/>
  <text x="110" y="520" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#B8421A">Pilot Q4 2026 · 100 MSMEs</text>

  <!-- Stats strip -->
  <g transform="translate(620, 480)">
    <text x="0" y="0" font-family="Fraunces, serif" font-size="48" font-weight="500" fill="#B8421A">60M+</text>
    <text x="0" y="28" font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#7A6B55">MSMEs</text>

    <text x="160" y="0" font-family="Fraunces, serif" font-size="48" font-weight="500" fill="#B8421A">4M+</text>
    <text x="160" y="28" font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#7A6B55">Visually impaired</text>

    <text x="380" y="0" font-family="Fraunces, serif" font-size="48" font-weight="500" fill="#B8421A">79%</text>
    <text x="380" y="28" font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#7A6B55">WhatsApp users</text>
  </g>
</svg>
